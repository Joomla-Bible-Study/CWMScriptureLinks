PLG_CONTENT_SCRIPTURELINKS_PROVIDERS_DESC="Aktiver eller deaktiver leverandører av bibeltekster. Lokale oversettelser er alltid tilgjengelige (GDPR-kompatible, ingen eksterne forespørsler). Nettleverandører foretar eksterne API-kall – se gjennom GDPR-/personvernkravene dine før du aktiverer."

