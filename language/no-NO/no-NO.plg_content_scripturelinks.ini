PLG_CONTENT_SCRIPTURELINKS_APIBIBLE_DESC="Hent passasjer fra API.Bible (American Bible Society). Krever en gratis API-nøkkel. Kun forespørsler på serversiden – besøkendes IP-adresser eksponeres aldri. Gir tilgang til opphavsrettsbeskyttede oversettelser (NIV, ESV, NLT, osv.) når de er godkjent av utgivere."

