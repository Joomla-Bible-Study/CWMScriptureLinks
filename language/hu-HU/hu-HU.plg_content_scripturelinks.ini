; Settings tab
PLG_CONTENT_SCRIPTURELINKS_MODE_LABEL="Érzékelési mód"
PLG_CONTENT_SCRIPTURELINKS_MODE_DESC="Címkézési mód: csak a {scripture}...{/scripture} és a {bible}...{/bible} címkéket cseréli le. Automatikus mód: a tartalomban található címkézetlen szentírás-utalásokat is észleli."
PLG_CONTENT_SCRIPTURELINKS_MODE_TAG="Csak címke mód"
PLG_CONTENT_SCRIPTURELINKS_MODE_AUTO="Az összes hivatkozás automatikus felismerése"

PLG_CONTENT_SCRIPTURELINKS_DISPLAY_LABEL="Kijelző mód"
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_DESC="Hogyan jelennek meg a szentírásrészek a tartalomban? Minden mód helyben tárolt vagy API által lekért szöveget használ – külső hivatkozások nélkül."
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_TOOLTIP="Elemleírás szövegrészlettel"
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_INLINE="Beágyazott szövegrész"
