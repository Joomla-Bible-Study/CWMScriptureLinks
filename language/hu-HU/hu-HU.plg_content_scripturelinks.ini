; Scripture tab — Providers panel
PLG_CONTENT_SCRIPTURELINKS_PROVIDERS_TITLE="Szentírás-szolgáltatók"
PLG_CONTENT_SCRIPTURELINKS_PROVIDERS_DESC="Bibliaszöveg-szolgáltatók engedélyezése vagy letiltása. Helyi fordítások mindig elérhetők (GDPR-kompatibilis, külső kérések nélkül). Az online szolgáltatók külső API-hívásokat kezdeményeznek – az engedélyezés előtt tekintse át a GDPR/adatvédelmi követelményeit."

PLG_CONTENT_SCRIPTURELINKS_GETBIBLE_LABEL="GetBible.net szolgáltató"
PLG_CONTENT_SCRIPTURELINKS_GETBIBLE_DESC="Szentírásrészletek lekérése a GetBible.net API-ból (nincs szükség API-kulcsra). Megjegyzés: Szerveroldali HTTP-kéréseket küld a getbible.net oldalnak – vegye figyelembe a GDPR vonatkozásait."

PLG_CONTENT_SCRIPTURELINKS_APIBIBLE_LABEL="API.Biblia Szolgáltató"
PLG_CONTENT_SCRIPTURELINKS_APIBIBLE_DESC="Részletek lekérése az API.Bible-ből (American Bible Society). Ingyenes API-kulcsot igényel. Csak szerveroldali kérések – a látogatók IP-címei soha nem kerülnek nyilvánosságra. Hozzáférést biztosít a szerzővédett fordításokhoz (NIV, ESV, NLT stb.), amennyiben azokat a kiadók jóváhagyják."

PLG_CONTENT_SCRIPTURELINKS_APIKEY_LABEL="API.Bible API-kulcs"
PLG_CONTENT_SCRIPTURELINKS_APIKEY_DESC="Add meg az API-kulcsodat a rest.api.bible oldalról. Regisztrálj az api.bible oldalon, hogy ingyenes kulcsot kapj."

PLG_CONTENT_SCRIPTURELINKS_GDPR_LABEL="GDPR mód"
PLG_CONTENT_SCRIPTURELINKS_GDPR_DESC="Engedélyezés esetén letiltja az összes külső API-hívást. Csak a helyben tárolt fordítások lesznek elérhetők."

PLG_CONTENT_SCRIPTURELINKS_GET_API_KEY="Szerezzen be egy ingyenes API-kulcsot"
PLG_CONTENT_SCRIPTURELINKS_SYNC_TRANSLATIONS="Fordítások szinkronizálása"

