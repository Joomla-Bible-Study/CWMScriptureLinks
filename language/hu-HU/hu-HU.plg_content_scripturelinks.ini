PLG_CONTENT_SCRIPTURELINKS_VERSION_DESC="Alapértelmezett bibliai fordítás az új üzenetekhez. Üzenetenként felülírható."

PLG_CONTENT_SCRIPTURELINKS_CACHE_LABEL="Gyorsítótár időtartama (nap)"
