; Scripture tab — Providers panel
PLG_CONTENT_SCRIPTURELINKS_PROVIDERS_TITLE="Poskytovatelé Písma"
PLG_CONTENT_SCRIPTURELINKS_PROVIDERS_DESC="Povolit nebo zakázat poskytovatele biblických textů. Lokální překlady jsou vždy k dispozici (v souladu s GDPR, žádné externí požadavky). Online poskytovatelé provádějí externí volání API – před povolením si prostudujte požadavky GDPR/ochrany osobních údajů."

PLG_CONTENT_SCRIPTURELINKS_GETBIBLE_LABEL="Poskytovatel GetBible.net"
PLG_CONTENT_SCRIPTURELINKS_GETBIBLE_DESC="Načítání pasáží z Písma z API GetBible.net (není vyžadován klíč API). Poznámka: Vytváří HTTP požadavky na straně serveru na getbible.net – zohledněte důsledky GDPR."

PLG_CONTENT_SCRIPTURELINKS_APIBIBLE_LABEL="Poskytovatel API.Bible"
PLG_CONTENT_SCRIPTURELINKS_APIBIBLE_DESC="Načítání pasáží z API.Bible (Americká biblická společnost). Vyžaduje bezplatný klíč API. Pouze požadavky na straně serveru – IP adresy návštěvníků nejsou nikdy odhaleny. Poskytuje přístup k překladům chráněným autorskými právy (NIV, ESV, NLT atd.) po schválení vydavateli."

PLG_CONTENT_SCRIPTURELINKS_APIKEY_LABEL="Klíč API API.Bible API"
PLG_CONTENT_SCRIPTURELINKS_APIKEY_DESC="Zadejte svůj API klíč ze souboru rest.api.bible. Zaregistrujte se na api.bible a získejte klíč zdarma."

PLG_CONTENT_SCRIPTURELINKS_GDPR_LABEL="Režim GDPR"
PLG_CONTENT_SCRIPTURELINKS_GDPR_DESC="Pokud je tato možnost povolena, zakáže všechna externí volání API. K dispozici budou pouze lokálně uložené překlady."

PLG_CONTENT_SCRIPTURELINKS_GET_API_KEY="Získejte bezplatný API klíč"
PLG_CONTENT_SCRIPTURELINKS_SYNC_TRANSLATIONS="Synchronizace překladů"

