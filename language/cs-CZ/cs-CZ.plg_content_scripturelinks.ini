PLG_CONTENT_SCRIPTURELINKS_MODE_DESC="Režim štítků: nahrazuje pouze štítky {scripture}...{/scripture} a {bible}...{/bible}. Automatický režim: detekuje také neoznačené odkazy na písma v obsahu."
