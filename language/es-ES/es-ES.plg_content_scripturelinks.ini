; CWM ScriptureLinks Content Plugin - Admin strings
PLG_CONTENT_SCRIPTURELINKS="Contenido - ScriptureLinks"
PLG_CONTENT_SCRIPTURELINKS_DESCRIPTION="Reemplaza automáticamente las etiquetas {scripture} y {bible} en el contenido del artículo con pasajes de las Escrituras Bíblicas."

; Tab labels
PLG_CONTENT_SCRIPTURELINKS_TAB_SETTINGS="Ajustes"
PLG_CONTENT_SCRIPTURELINKS_TAB_SETTINGS_DESC="Configuración general del plugin."
PLG_CONTENT_SCRIPTURELINKS_TAB_SCRIPTURE="Sagrada Escritura"
PLG_CONTENT_SCRIPTURELINKS_TAB_SCRIPTURE_DESC="Configure los proveedores de textos bíblicos y gestione las traducciones locales de la Biblia."

; Settings tab
PLG_CONTENT_SCRIPTURELINKS_MODE_LABEL="Modo de detección"
PLG_CONTENT_SCRIPTURELINKS_MODE_DESC="Modo de etiquetas: solo reemplaza las etiquetas {scripture}...{/scripture} y {bible}...{/bible}. Modo automático: también detecta referencias bíblicas sin etiquetar en el contenido."
PLG_CONTENT_SCRIPTURELINKS_MODE_TAG="Solo modo de etiquetas"
PLG_CONTENT_SCRIPTURELINKS_MODE_AUTO="Detectar automáticamente todas las referencias"

PLG_CONTENT_SCRIPTURELINKS_DISPLAY_LABEL="Modo de visualización"
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_DESC="Cómo se muestran los pasajes bíblicos en el contenido. Todos los modos utilizan texto almacenado localmente o obtenido mediante API; no se utilizan enlaces externos."
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_TOOLTIP="Información emergente con texto del pasaje"
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_INLINE="Texto del pasaje en línea"
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_POPUP="Ventana emergente"

; Scripture tab — Providers panel
PLG_CONTENT_SCRIPTURELINKS_PROVIDERS_TITLE="Proveedores de Escrituras"
PLG_CONTENT_SCRIPTURELINKS_PROVIDERS_DESC="Habilite o deshabilite los proveedores de textos bíblicos. Las traducciones locales siempre están disponibles (cumplen con el RGPD, sin solicitudes externas). Los proveedores en línea realizan llamadas API externas; revise sus requisitos de RGPD y privacidad antes de habilitarlos."

PLG_CONTENT_SCRIPTURELINKS_GETBIBLE_LABEL="Proveedor de GetBible.net"
PLG_CONTENT_SCRIPTURELINKS_GETBIBLE_DESC="Obtenga pasajes bíblicos de la API de GetBible.net (no requiere clave API). Nota: Realiza solicitudes HTTP del lado del servidor a getbible.net (considere las implicaciones del RGPD)."

PLG_CONTENT_SCRIPTURELINKS_APIBIBLE_LABEL="Proveedor API.Bible"
PLG_CONTENT_SCRIPTURELINKS_APIBIBLE_DESC="Obtenga pasajes de API.Bible (Sociedad Bíblica Americana). Requiere una clave API gratuita. Solo solicitudes del lado del servidor; las IP de los visitantes nunca se exponen. Proporciona acceso a traducciones con derechos de autor (NIV, ESV, NLT, etc.) una vez aprobadas por los editores."

PLG_CONTENT_SCRIPTURELINKS_APIKEY_LABEL="Clave API de API.Bible"
PLG_CONTENT_SCRIPTURELINKS_APIKEY_DESC="Introduce tu clave API de rest.api.bible. Regístrate en api.bible para obtener una clave gratuita."

PLG_CONTENT_SCRIPTURELINKS_GDPR_LABEL="Modo RGPD"
PLG_CONTENT_SCRIPTURELINKS_GDPR_DESC="Cuando está habilitada, desactiva todas las llamadas a la API externa. Solo estarán disponibles las traducciones almacenadas localmente."

PLG_CONTENT_SCRIPTURELINKS_GET_API_KEY="Obtenga una clave API gratuita"
PLG_CONTENT_SCRIPTURELINKS_SYNC_TRANSLATIONS="Sincronizar traducciones"

; Scripture tab — Settings panel
PLG_CONTENT_SCRIPTURELINKS_SETTINGS_TITLE="Configuración de las Escrituras"

PLG_CONTENT_SCRIPTURELINKS_VERSION_LABEL="Versión de la Biblia predeterminada"
PLG_CONTENT_SCRIPTURELINKS_VERSION_DESC="Traducción de la Biblia predeterminada para mensajes nuevos. Se puede modificar para cada mensaje."

PLG_CONTENT_SCRIPTURELINKS_CACHE_LABEL="Duración de la caché (días)"
PLG_CONTENT_SCRIPTURELINKS_CACHE_DESC="¿Cuántos días deben almacenarse en caché los pasajes bíblicos obtenidos antes de volver a obtenerlos del proveedor?"

; Scripture tab — Local Translations panel
PLG_CONTENT_SCRIPTURELINKS_LOCAL_TRANSLATIONS="Traducciones locales"
PLG_CONTENT_SCRIPTURELINKS_LOCAL_TRANSLATIONS_DESC="Descarga traducciones de la Biblia para usarlas sin conexión. Las traducciones descargadas se procesan íntegramente desde tu base de datos, sin llamadas a API externas y totalmente conforme con el RGPD."
PLG_CONTENT_SCRIPTURELINKS_TRANSLATIONS_TABLE_MISSING="La tabla de traducciones bíblicas no está instalada. Vuelva a instalar la biblioteca de escrituras de CWM."
PLG_CONTENT_SCRIPTURELINKS_TRANSLATIONS_NONE="No se encontraron traducciones en el catálogo. Es posible que no se hayan instalado los datos de origen de la traducción."

