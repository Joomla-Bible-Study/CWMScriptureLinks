; CWM ScriptureLinks Content Plugin - Admin strings
PLG_CONTENT_SCRIPTURELINKS="Inhoud - Schriftlinks"
PLG_CONTENT_SCRIPTURELINKS_DESCRIPTION="Vervangt automatisch de tags {scripture} en {bible} in de artikelinhoud door Bijbelteksten."

; Tab labels
PLG_CONTENT_SCRIPTURELINKS_TAB_SETTINGS="Instellingen"
PLG_CONTENT_SCRIPTURELINKS_TAB_SETTINGS_DESC="Algemene plugininstellingen."
PLG_CONTENT_SCRIPTURELINKS_TAB_SCRIPTURE="Schrift"
PLG_CONTENT_SCRIPTURELINKS_TAB_SCRIPTURE_DESC="Configureer aanbieders van bijbelteksten en beheer lokale bijbelvertalingen."

; Settings tab
PLG_CONTENT_SCRIPTURELINKS_MODE_LABEL="Detectiemodus"
PLG_CONTENT_SCRIPTURELINKS_MODE_DESC="Tagmodus: vervangt alleen de tags {scripture}...{/scripture} en {bible}...{/bible}. Automatische modus: detecteert ook niet-getagde verwijzingen naar de Schrift in de inhoud."
PLG_CONTENT_SCRIPTURELINKS_MODE_TAG="Alleen tagmodus"
PLG_CONTENT_SCRIPTURELINKS_MODE_AUTO="Alle referenties automatisch detecteren"

PLG_CONTENT_SCRIPTURELINKS_DISPLAY_LABEL="Weergavemodus"
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_DESC="Hoe Bijbelpassages in de inhoud worden weergegeven. Alle weergavemodi gebruiken lokaal opgeslagen of via de API opgehaalde tekst — geen externe links."
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_TOOLTIP="Tooltip met passagetekst"
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_INLINE="Inline passagetekst"
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_POPUP="Pop-upvenster"

; Scripture tab — Providers panel
PLG_CONTENT_SCRIPTURELINKS_PROVIDERS_TITLE="Schriftleveranciers"
PLG_CONTENT_SCRIPTURELINKS_PROVIDERS_DESC="Schakel aanbieders van Bijbelteksten in of uit. Lokale vertalingen zijn altijd beschikbaar (conform de AVG, geen externe verzoeken). Online aanbieders doen externe API-aanroepen — controleer uw AVG/privacyvereisten voordat u deze inschakelt."

PLG_CONTENT_SCRIPTURELINKS_GETBIBLE_LABEL="GetBible.net-aanbieder"
PLG_CONTENT_SCRIPTURELINKS_GETBIBLE_DESC="Haal bijbelteksten op via de GetBible.net API (geen API-sleutel vereist). Let op: Er worden HTTP-verzoeken naar getbible.net verzonden via de server — houd rekening met de AVG-implicaties."

PLG_CONTENT_SCRIPTURELINKS_APIBIBLE_LABEL="API.Bijbelprovider"
PLG_CONTENT_SCRIPTURELINKS_APIBIBLE_DESC="Haal passages op van API.Bible (American Bible Society). Vereist een gratis API-sleutel. Alleen server-side verzoeken — IP-adressen van bezoekers worden nooit openbaar gemaakt. Biedt toegang tot auteursrechtelijk beschermde vertalingen (NIV, ESV, NLT, enz.) indien goedgekeurd door de uitgevers."

PLG_CONTENT_SCRIPTURELINKS_APIKEY_LABEL="API.Bijbel API-sleutel"
PLG_CONTENT_SCRIPTURELINKS_APIKEY_DESC="Voer uw API-sleutel van rest.api.bible in. Registreer u op api.bible om een gratis sleutel te ontvangen."

PLG_CONTENT_SCRIPTURELINKS_GDPR_LABEL="GDPR-modus"
PLG_CONTENT_SCRIPTURELINKS_GDPR_DESC="Indien ingeschakeld, worden alle externe API-aanroepen uitgeschakeld. Alleen lokaal opgeslagen vertalingen zijn beschikbaar."

PLG_CONTENT_SCRIPTURELINKS_GET_API_KEY="Ontvang een gratis API-sleutel"
PLG_CONTENT_SCRIPTURELINKS_SYNC_TRANSLATIONS="Vertalingen synchroniseren"

; Scripture tab — Settings panel
PLG_CONTENT_SCRIPTURELINKS_SETTINGS_TITLE="Schriftverwijzingen"

PLG_CONTENT_SCRIPTURELINKS_VERSION_LABEL="Standaard Bijbelversie"
PLG_CONTENT_SCRIPTURELINKS_VERSION_DESC="Standaard Bijbelvertaling voor nieuwe berichten. Kan per bericht worden overschreven."

PLG_CONTENT_SCRIPTURELINKS_CACHE_LABEL="Cacheduur (dagen)"
PLG_CONTENT_SCRIPTURELINKS_CACHE_DESC="Hoeveel dagen moeten opgehaalde Bijbelpassages in de cache worden bewaard voordat ze opnieuw van de provider worden opgehaald?"

; Scripture tab — Local Translations panel
PLG_CONTENT_SCRIPTURELINKS_LOCAL_TRANSLATIONS="Lokale vertalingen"
PLG_CONTENT_SCRIPTURELINKS_LOCAL_TRANSLATIONS_DESC="Download Bijbelvertalingen voor offline gebruik. De gedownloade vertalingen worden volledig vanuit uw eigen database aangeboden — geen externe API-aanroepen, volledig GDPR-conform."
PLG_CONTENT_SCRIPTURELINKS_TRANSLATIONS_TABLE_MISSING="De tabel met Bijbelvertalingen is niet geïnstalleerd. Installeer de CWM-bijbelbibliotheek opnieuw."
PLG_CONTENT_SCRIPTURELINKS_TRANSLATIONS_NONE="Er zijn geen vertalingen gevonden in de catalogus. De vertaalgegevens zijn mogelijk niet geïnstalleerd."

