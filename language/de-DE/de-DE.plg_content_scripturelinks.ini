; CWM ScriptureLinks Content Plugin - Admin strings
PLG_CONTENT_SCRIPTURELINKS="Inhalt – Bibelstellenlinks"
PLG_CONTENT_SCRIPTURELINKS_DESCRIPTION="Ersetzt automatisch die Tags {scripture} und {bible} im Artikelinhalt durch Bibelstellen."

; Tab labels
PLG_CONTENT_SCRIPTURELINKS_TAB_SETTINGS="Einstellungen"
PLG_CONTENT_SCRIPTURELINKS_TAB_SETTINGS_DESC="Allgemeine Plugin-Einstellungen."
PLG_CONTENT_SCRIPTURELINKS_TAB_SCRIPTURE="Schrift"
PLG_CONTENT_SCRIPTURELINKS_TAB_SCRIPTURE_DESC="Konfigurieren Sie Bibelanbieter und verwalten Sie lokale Bibelübersetzungen."

; Settings tab
PLG_CONTENT_SCRIPTURELINKS_MODE_LABEL="Erkennungsmodus"
PLG_CONTENT_SCRIPTURELINKS_MODE_DESC="Tag-Modus: Ersetzt nur die Tags {scripture}...{/scripture} und {bible}...{/bible}. Automatik-Modus: Erkennt auch nicht getaggte Bibelstellen im Inhalt."
PLG_CONTENT_SCRIPTURELINKS_MODE_TAG="Nur im Tag-Modus"
PLG_CONTENT_SCRIPTURELINKS_MODE_AUTO="Alle Referenzen automatisch erkennen"

PLG_CONTENT_SCRIPTURELINKS_DISPLAY_LABEL="Anzeigemodus"
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_DESC="So werden Bibelstellen im Inhalt angezeigt. Alle Modi verwenden lokal gespeicherten oder per API abgerufenen Text – keine externen Links."
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_TOOLTIP="Tooltip mit Text"
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_INLINE="Inline-Passagetext"
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_POPUP="Popup-Fenster"

; Scripture tab — Providers panel
PLG_CONTENT_SCRIPTURELINKS_PROVIDERS_TITLE="Bibelanbieter"
PLG_CONTENT_SCRIPTURELINKS_PROVIDERS_DESC="Bibeltextanbieter aktivieren oder deaktivieren. Lokale Übersetzungen sind immer verfügbar (DSGVO-konform, keine externen Anfragen). Online-Anbieter führen externe API-Aufrufe durch – prüfen Sie Ihre DSGVO-/Datenschutzbestimmungen, bevor Sie die Anbieter aktivieren."

PLG_CONTENT_SCRIPTURELINKS_GETBIBLE_LABEL="GetBible.net-Anbieter"
PLG_CONTENT_SCRIPTURELINKS_GETBIBLE_DESC="Bibelstellen können über die GetBible.net-API abgerufen werden (kein API-Schlüssel erforderlich). Hinweis: Es werden serverseitige HTTP-Anfragen an getbible.net gesendet – bitte beachten Sie die Bestimmungen der DSGVO."

PLG_CONTENT_SCRIPTURELINKS_APIBIBLE_LABEL="API.Bible Provider"
PLG_CONTENT_SCRIPTURELINKS_APIBIBLE_DESC="Ruft Bibelstellen von API.Bible (American Bible Society) ab. Ein kostenloser API-Schlüssel ist erforderlich. Es werden ausschließlich serverseitige Anfragen gestellt – die IP-Adressen der Besucher werden niemals offengelegt. Der Zugriff auf urheberrechtlich geschützte Übersetzungen (NIV, ESV, NLT usw.) ist nach Genehmigung durch die Verlage möglich."

PLG_CONTENT_SCRIPTURELINKS_APIKEY_LABEL="API.Bible API-Schlüssel"
PLG_CONTENT_SCRIPTURELINKS_APIKEY_DESC="Geben Sie Ihren API-Schlüssel von rest.api.bible ein. Registrieren Sie sich bei api.bible, um einen kostenlosen Schlüssel zu erhalten."

PLG_CONTENT_SCRIPTURELINKS_GDPR_LABEL="DSGVO-Modus"
PLG_CONTENT_SCRIPTURELINKS_GDPR_DESC="Wenn diese Option aktiviert ist, werden alle externen API-Aufrufe deaktiviert. Es stehen dann nur noch lokal gespeicherte Übersetzungen zur Verfügung."

PLG_CONTENT_SCRIPTURELINKS_GET_API_KEY="Holen Sie sich einen kostenlosen API-Schlüssel"
PLG_CONTENT_SCRIPTURELINKS_SYNC_TRANSLATIONS="Übersetzungen synchronisieren"

; Scripture tab — Settings panel
PLG_CONTENT_SCRIPTURELINKS_SETTINGS_TITLE="Bibeltexte"

PLG_CONTENT_SCRIPTURELINKS_VERSION_LABEL="Standard-Bibelversion"
PLG_CONTENT_SCRIPTURELINKS_VERSION_DESC="Standardmäßige Bibelübersetzung für neue Predigten. Kann für jede Predigt individuell angepasst werden."

PLG_CONTENT_SCRIPTURELINKS_CACHE_LABEL="Cache-Dauer (Tage)"
PLG_CONTENT_SCRIPTURELINKS_CACHE_DESC="Wie viele Tage sollen abgerufene Bibelstellen zwischengespeichert werden, bevor sie erneut vom Anbieter abgerufen werden?"

; Scripture tab — Local Translations panel
PLG_CONTENT_SCRIPTURELINKS_LOCAL_TRANSLATIONS="Lokale Übersetzungen"
PLG_CONTENT_SCRIPTURELINKS_LOCAL_TRANSLATIONS_DESC="Laden Sie Bibelübersetzungen zur Offline-Nutzung herunter. Die heruntergeladenen Übersetzungen werden vollständig aus Ihrer Datenbank bereitgestellt – keine externen API-Aufrufe, vollständig DSGVO-konform."
PLG_CONTENT_SCRIPTURELINKS_TRANSLATIONS_TABLE_MISSING="Die Bibelübersetzungstabelle ist nicht installiert. Bitte installieren Sie die CWM-Schriftbibliothek neu."
PLG_CONTENT_SCRIPTURELINKS_TRANSLATIONS_NONE="Im Katalog wurden keine Übersetzungen gefunden. Möglicherweise wurden die Übersetzungsdaten nicht installiert."

