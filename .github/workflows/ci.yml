name: CI

# The build, lint and test steps live in cwm-build-tools so every CWM
# extension runs the same pipeline and a fix lands everywhere at once. What
# stays here is what is genuinely this repository's own: when CI runs, and
# the handful of values that differ from the shared defaults.
#
# The reusable workflow is .github/workflows/joomla-package-ci.yml in
# Joomla-Bible-Study/cwm-build-tools. To see what the inputs do, or to change
# a step, edit it there.

on:
  push:
    branches: [ "main", "master", "development" ]
    paths-ignore:
      - '**.md'
      - 'language/**'
  pull_request:
    branches: [ "main", "master", "development" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: PHP Lint & Tests
    # `v1` is a moving tag on cwm-build-tools, re-pointed at each release — the
    # CI equivalent of the `^1.9.0` Composer constraint in composer.json.
    uses: Joomla-Bible-Study/cwm-build-tools/.github/workflows/joomla-package-ci.yml@v1
    with:
      # This project tracks 8.4; the shared default is 8.3.
      php-version: '8.4'
      node-version: '24'
      # The scripture library is a submodule, and the package embeds it.
      submodules: 'recursive'
      # Built first, as a prebuilt include the outer package consumes.
      lib-path: 'libraries/lib_cwmscripture'
      build-command: 'composer build'
      package-glob: 'build/dist/pkg_cwmscripture-*.zip'