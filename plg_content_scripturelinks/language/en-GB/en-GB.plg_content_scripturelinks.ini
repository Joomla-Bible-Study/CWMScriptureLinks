; CWM ScriptureLinks Content Plugin - Admin strings
PLG_CONTENT_SCRIPTURELINKS="Content - ScriptureLinks"
PLG_CONTENT_SCRIPTURELINKS_DESCRIPTION="Automatically replaces {scripture} and {bible} tags in article content with Bible scripture passages."

; Tab labels
PLG_CONTENT_SCRIPTURELINKS_TAB_SETTINGS="Settings"
PLG_CONTENT_SCRIPTURELINKS_TAB_SETTINGS_DESC="General plugin settings."
PLG_CONTENT_SCRIPTURELINKS_TAB_SCRIPTURE="Scripture"
PLG_CONTENT_SCRIPTURELINKS_TAB_SCRIPTURE_DESC="Configure scripture providers and manage local Bible translations."

; Settings tab
PLG_CONTENT_SCRIPTURELINKS_MODE_LABEL="Detection Mode"
PLG_CONTENT_SCRIPTURELINKS_MODE_DESC="Tag mode: only replaces {scripture}...{/scripture} and {bible}...{/bible} tags. Auto mode: also detects untagged scripture references in content."
PLG_CONTENT_SCRIPTURELINKS_MODE_TAG="Tag mode only"
PLG_CONTENT_SCRIPTURELINKS_MODE_AUTO="Auto-detect all references"

PLG_CONTENT_SCRIPTURELINKS_DISPLAY_LABEL="Display Mode"
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_DESC="How scripture references are displayed in content."
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_LINK="Inline link (to BibleGateway)"
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_TOOLTIP="Tooltip with passage text"
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_INLINE="Inline passage text"
PLG_CONTENT_SCRIPTURELINKS_DISPLAY_POPUP="Popup window"

; Scripture tab — Providers panel
PLG_CONTENT_SCRIPTURELINKS_PROVIDERS_TITLE="Scripture Providers"
PLG_CONTENT_SCRIPTURELINKS_PROVIDERS_DESC="Enable or disable Bible text providers. Local translations are always available (GDPR-compliant, no external requests). Online providers make external API calls — review your GDPR/privacy requirements before enabling."

PLG_CONTENT_SCRIPTURELINKS_GETBIBLE_LABEL="GetBible.net Provider"
PLG_CONTENT_SCRIPTURELINKS_GETBIBLE_DESC="Fetch scripture passages from the GetBible.net API (no API key required). Note: Makes server-side HTTP requests to getbible.net — consider GDPR implications."

PLG_CONTENT_SCRIPTURELINKS_APIBIBLE_LABEL="API.Bible Provider"
PLG_CONTENT_SCRIPTURELINKS_APIBIBLE_DESC="Fetch passages from API.Bible (American Bible Society). Requires a free API key. Server-side requests only — visitor IPs are never exposed. Provides access to copyrighted translations (NIV, ESV, NLT, etc.) when approved by publishers."

PLG_CONTENT_SCRIPTURELINKS_APIKEY_LABEL="API.Bible API Key"
PLG_CONTENT_SCRIPTURELINKS_APIKEY_DESC="Enter your API key from rest.api.bible. Register at api.bible to get a free key."

PLG_CONTENT_SCRIPTURELINKS_GDPR_LABEL="GDPR Mode"
PLG_CONTENT_SCRIPTURELINKS_GDPR_DESC="When enabled, disables all external API calls. Only locally stored translations will be available."

PLG_CONTENT_SCRIPTURELINKS_GET_API_KEY="Get a Free API Key"
PLG_CONTENT_SCRIPTURELINKS_SYNC_TRANSLATIONS="Sync Translations"

