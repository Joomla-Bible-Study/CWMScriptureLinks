PLG_TASK_CWMSCRIPTURE="Task - CWM Scripture"
PLG_TASK_CWMSCRIPTURE_XML_DESCRIPTION="Runs deferred scripture library background jobs — e.g. downloading the core Bible translations scheduled during install."

PLG_TASK_CWMSCRIPTURE_DOWNLOAD_CORE_TITLE="CWM Scripture: Download Core Translations"
PLG_TASK_CWMSCRIPTURE_DOWNLOAD_CORE_DESC="Downloads the core public-domain Bible translations (KJV, WEB, ASV) from GetBible.net so local passage rendering works without external API calls. Scheduled automatically after installing the scripture library; removes itself once all translations have been imported."
